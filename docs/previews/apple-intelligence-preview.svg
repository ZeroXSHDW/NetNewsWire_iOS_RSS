<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Apple Intelligence RSS digest workflow preview</title>
  <desc id="desc">A three-step interface illustration showing selected NetNewsWire articles, a Shortcuts Use Model step, and a reviewed digest with confirmed facts and no action recommendation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#07111f" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="760" fill="#0f172a"/>
  <text x="70" y="70" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" font-weight="700">Optional Apple Intelligence digest</text>
  <text x="70" y="104" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Selected evidence in NetNewsWire → Shortcuts → reviewed summary in Notes.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="365" height="500" rx="28" fill="#ffffff"/>
    <rect x="483" y="145" width="365" height="500" rx="28" fill="#ffffff"/>
    <rect x="896" y="145" width="434" height="500" rx="28" fill="#ffffff"/>
  </g>

  <rect x="70" y="145" width="365" height="80" rx="28" fill="#e0f2fe"/>
  <text x="102" y="180" fill="#0369a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">STEP 1 · NETNEWSWIRE</text>
  <text x="102" y="208" fill="#0c4a6e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Select evidence</text>
  <text x="101" y="259" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">You choose what leaves the reader.</text>
  <rect x="101" y="286" width="303" height="62" rx="14" fill="#f1f5f9"/>
  <circle cx="127" cy="317" r="9" fill="#2563eb"/>
  <text x="150" y="311" fill="#263750" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">ECB Press</text>
  <text x="150" y="332" fill="#6b7c93" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">selected article · finance</text>
  <rect x="101" y="361" width="303" height="62" rx="14" fill="#f1f5f9"/>
  <circle cx="127" cy="392" r="9" fill="#2563eb"/>
  <text x="150" y="386" fill="#263750" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">CISA Advisories</text>
  <text x="150" y="407" fill="#6b7c93" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">selected article · cyber</text>
  <rect x="101" y="454" width="303" height="48" rx="14" fill="#dbeafe"/>
  <text x="124" y="484" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">Share selected items</text>
  <text x="101" y="565" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">No silent unread-database export.</text>
  <text x="101" y="588" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">The input is deliberate and bounded.</text>

  <rect x="483" y="145" width="365" height="80" rx="28" fill="#f3e8ff"/>
  <text x="515" y="180" fill="#7e22ce" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">STEP 2 · SHORTCUTS</text>
  <text x="515" y="208" fill="#581c87" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Use Model</text>
  <rect x="539" y="267" width="253" height="116" rx="24" fill="url(#violet)"/>
  <circle cx="581" cy="325" r="23" fill="#ffffff" opacity=".92"/>
  <path d="M572 325l7-8 6 5 8-10 8 8" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="316" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Daily Finance +</text>
  <text x="620" y="340" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Cyber Digest</text>
  <text x="515" y="435" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">The fixed prompt requires:</text>
  <text x="515" y="465" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">• supplied evidence only</text>
  <text x="515" y="490" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">• confirmed facts vs. claims</text>
  <text x="515" y="515" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">• Dublin-time event context</text>
  <text x="515" y="540" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">• no invented CVEs or prices</text>
  <rect x="515" y="574" width="301" height="42" rx="13" fill="#f5f3ff"/>
  <text x="538" y="601" fill="#7e22ce" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">review before saving</text>

  <rect x="896" y="145" width="434" height="80" rx="28" fill="#dcfce7"/>
  <text x="928" y="180" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">STEP 3 · APPLE NOTES</text>
  <text x="928" y="208" fill="#064e3b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Reviewed digest</text>
  <text x="928" y="257" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Finance + Cyber Digest · Dublin time</text>
  <rect x="928" y="281" width="370" height="92" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="948" y="303" width="88" height="24" rx="12" fill="#bbf7d0"/>
  <text x="966" y="320" fill="#166534" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700">CONFIRMED</text>
  <text x="1052" y="316" fill="#1f2937" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Event and source link retained</text>
  <text x="948" y="348" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">The note preserves provenance instead of flattening it.</text>
  <rect x="928" y="389" width="370" height="92" rx="16" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="948" y="411" width="73" height="24" rx="12" fill="#fef3c7"/>
  <text x="962" y="428" fill="#92400e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700">CLAIM</text>
  <text x="1036" y="424" fill="#1f2937" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Context marked for review</text>
  <text x="948" y="456" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Uncertainty stays visible; missing facts stay missing.</text>
  <rect x="928" y="497" width="370" height="69" rx="16" fill="#f1f5f9"/>
  <text x="948" y="526" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">No action recommendation</text>
  <text x="948" y="549" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">A reading aid, not trading or incident-response advice.</text>
  <text x="928" y="606" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Illustrative preview · not a screenshot of Apple UI.</text>
</svg>
